<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROSILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #ccc;
    --bg: #111;
    --dim: #777;
    --border: #333;
    --hover: rgba(232, 144, 32, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'EB Garamond', Garamond, 'Times New Roman', serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.75;
    font-size: 18px;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 6rem 2rem 4rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--dim);
    font-style: italic;
    margin-bottom: 3rem;
    letter-spacing: 0.02em;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  .readings {
    list-style: none;
  }

  .readings li {
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--border);
  }

  .readings li:first-child {
    border-top: 1px solid var(--border);
  }

  .readings a {
    color: var(--text);
    text-decoration: none;
    display: block;
    transition: color 0.2s;
  }

  .readings a:hover {
    color: #fff;
  }

  .readings a:hover .story-title {
    border-bottom-color: var(--hover);
  }

  .story-title {
    font-size: 1.1rem;
    font-weight: 600;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .story-author {
    font-size: 0.9rem;
    color: var(--dim);
    font-style: italic;
    margin-top: 0.15rem;
  }

  .story-desc {
    font-size: 0.82rem;
    color: #666;
    margin-top: 0.4rem;
    line-height: 1.5;
  }

  ::selection {
    background: rgba(255, 140, 0, 0.35);
    color: inherit;
  }
</style>
</head>
<body>
<div class="container">

  <h1>PROSILE</h1>
  <p class="subtitle"><strong>P</strong>rosile <strong>R</strong>eads <strong>O</strong>ver <strong>S</strong>yntax, <strong>I</strong>magery, <strong>L</strong>exis, <strong>E</strong>verywhere</p>

  <ul class="readings">
    <li>
      <a href="eric-mutis/">
        <div class="story-title">The Graveless Doll of Eric Mutis</div>
        <div class="story-author">Karen Russell</div>
        <div class="story-desc">Annotated close reading with sentence-level marginalia. From <em>Vampires in the Lemon Grove</em> (2013).</div>
      </a>
    </li>
  </ul>

</div>
</body>
</html>
